openapi: 3.1.0
info:
  title: Loan Submission API
  version: 1.0.0
  description: Submit a loan application with customer, spouse when applicable, and car collateral information.
servers:
  - url: http://localhost:8080
paths:
  /v1/loan-applications:
    post:
      operationId: submitLoanApplication
      summary: Submit a loan application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationSubmission"
      responses:
        "201":
          description: Application created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationConfirmation"
        "400":
          description: Request body is malformed or has an unsupported shape.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: One or more request fields failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "500":
          description: The application could not be persisted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    LoanApplicationSubmission:
      type: object
      additionalProperties: false
      required: [customer, car, loan]
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        spouse:
          $ref: "#/components/schemas/Spouse"
        car:
          $ref: "#/components/schemas/CarCollateral"
        loan:
          $ref: "#/components/schemas/ProposedLoan"
      allOf:
        - if:
            properties:
              customer:
                properties:
                  marital_status:
                    const: MARRIED
            required: [customer]
          then:
            required: [spouse]
          else:
            not:
              required: [spouse]
      description: spouse is required when customer.marital_status is MARRIED and must be omitted otherwise.
    Customer:
      type: object
      additionalProperties: false
      required: [full_name, id_number, address, birth_date, phone_number, email, monthly_income, marital_status]
      properties:
        full_name:
          type: string
          minLength: 1
        id_number:
          type: string
          minLength: 1
        address:
          $ref: "#/components/schemas/Address"
        birth_date:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        phone_number:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        monthly_income:
          $ref: "#/components/schemas/NonNegativeAmount"
        marital_status:
          type: string
          minLength: 1
          enum: [MARRIED, UNMARRIED]
    Address:
      type: object
      additionalProperties: false
      required: [street, city, postal_code]
      properties:
        street:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        postal_code:
          type: string
          minLength: 1
    Spouse:
      type: object
      additionalProperties: false
      required: [full_name, id_card_number, phone_number, monthly_income]
      properties:
        full_name:
          type: string
          minLength: 1
        id_card_number:
          type: string
          minLength: 1
        phone_number:
          type: string
          minLength: 1
        monthly_income:
          $ref: "#/components/schemas/NonNegativeAmount"
    CarCollateral:
      type: object
      additionalProperties: false
      required: [brand, model, manufacturing_year, license_plate]
      properties:
        brand:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        manufacturing_year:
          type: integer
          minimum: 1000
          maximum: 9999
          description: Must not be later than the current calendar year.
        license_plate:
          type: string
          minLength: 1
    ProposedLoan:
      type: object
      additionalProperties: false
      required: [amount, tenure_months]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 100
          description: Amount in the application's configured currency.
        tenure_months:
          type: integer
          minimum: 3
          maximum: 48
    NonNegativeAmount:
      type: number
      minimum: 0
      description: Monetary amount in the application's configured currency.
    LoanApplicationConfirmation:
      type: object
      additionalProperties: false
      required: [application_id, status]
      properties:
        application_id:
          type: string
          format: uuid
        status:
          type: string
          const: IN_PROGRESS
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required: [type, title, status]
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
